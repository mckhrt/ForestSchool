<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#7cbf43"><title>Reggie & Ronnie — Dandelion Dash!</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,'Trebuchet MS',sans-serif;color:#3c230d;background:#4b8b37;touch-action:manipulation;user-select:none;-webkit-user-select:none}button{font:inherit;cursor:pointer;touch-action:none}#game{position:relative;min-height:100dvh;overflow:hidden;background:linear-gradient(#6bc9f4 0%,#c6eeff 38%,#a1d36c 39%,#7ab840 100%)}.cloud{position:absolute;top:11%;left:8%;width:120px;height:40px;border-radius:50%;background:#fff9;filter:blur(7px)}.cloud.right{left:auto;right:8%;top:17%}.fence{position:absolute;top:37%;height:100px;width:100%;background:repeating-linear-gradient(90deg,#a76c39 0 21px,#8d552c 22px 25px,#bb8147 26px 43px,#86512c 44px 47px);border-top:10px solid #a16b3e;opacity:.52}.flowers{position:absolute;inset:43% 0 0;pointer-events:none;background-image:radial-gradient(circle,#ffe75b 0 5px,#fff4aa 6px 10px,transparent 11px),radial-gradient(circle,#fff 0 5px,#ffe15e 6px 9px,transparent 10px);background-size:117px 130px,150px 140px;background-position:0 0,60px 65px}.heading{position:relative;z-index:1;text-align:center;padding:9px 15px 5px;margin:8px auto 0;max-width:max-content;background:linear-gradient(#ffe9b1,#e5ae65);border:4px solid #9e632e;border-radius:24px;box-shadow:0 5px #75441f;transform:rotate(-1deg)}.heading b{display:block;font-size:clamp(20px,4.5vw,32px);line-height:1.08}.heading span{display:block;font-size:clamp(18px,4vw,29px);font-weight:1000;color:#448e26;text-shadow:1px 2px #ecffad}.timer{position:relative;z-index:1;margin:11px auto;width:125px;padding:3px;background:linear-gradient(#a2602d,#633414);border:4px solid #c48c4a;border-radius:13px;box-shadow:0 4px #693917;color:#fff;text-align:center;font-size:29px;font-weight:1000;font-variant-numeric:tabular-nums}.lanes{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-width:1000px;margin:auto;padding:5px 12px 18px}.lanes:after{content:'';position:absolute;top:0;bottom:0;left:50%;width:5px;transform:translateX(-50%);background:linear-gradient(#915521,#c38b4c,#885020);border-radius:5px;pointer-events:none}.lane{text-align:center;min-width:0;border-radius:18px;padding:4px 7px 12px;background:#ffffff26}.lane:nth-child(2){background:#ffe0ad33}.name{background:linear-gradient(#385e24,#1c3e18);border:4px solid #b47d3b;border-radius:15px;color:#fff;padding:5px;margin-bottom:7px;box-shadow:0 4px #78491e}.lane:nth-child(2) .name{background:linear-gradient(#b95b1a,#7d310e)}.name strong{display:block;font-size:clamp(19px,4vw,30px)}.name small{font-size:11px;font-weight:900;letter-spacing:1px}.pigbox{height:clamp(115px,25vw,235px);display:flex;justify-content:center;align-items:end}.pig{height:100%;width:100%;max-width:260px;overflow:visible;filter:drop-shadow(0 5px 3px #2d5b2850)}.leafbox{height:clamp(110px,20vw,185px);display:flex;justify-content:center;position:relative}.leaf{height:100%;width:100%;max-width:190px;filter:drop-shadow(2px 4px 2px #275c2850)}.meter{height:20px;background:#fff2cc;border:3px solid #346323;border-radius:15px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(#c4fa75,#56b82e)}.stats{display:flex;align-items:center;justify-content:space-between;font-size:clamp(11px,2vw,15px);font-weight:900;margin:8px 0}.pct{font-size:clamp(17px,3vw,24px);color:#286320}.bites{background:#fff1c6d9;border:2px solid #bb8a50;border-radius:10px;font-size:clamp(14px,2.8vw,21px);font-weight:900;padding:5px;margin-bottom:9px}.tap{width:100%;min-height:95px;border:3px solid #8f4c15;border-bottom:7px solid #a96b18;border-radius:19px;background:linear-gradient(#fff081,#ffc331);font-size:clamp(14px,3vw,24px);font-weight:1000;color:#66340e;box-shadow:0 5px 6px #57371e55}.lane:nth-child(2) .tap{background:linear-gradient(#ffd391,#ff943f);border-bottom-color:#b45d21}.tap:active{transform:translateY(3px)}.tap:disabled{opacity:.55}.hand{display:block;font-size:27px}.chew .pig{animation:chew .13s}@keyframes chew{50%{transform:translateY(7px) scale(1.05)}}.happy .pig{animation:happy .55s infinite}@keyframes happy{50%{transform:translateY(-18px) rotate(-5deg)}}.sad .pig{animation:sad 1.2s infinite;filter:grayscale(.35) drop-shadow(0 5px 3px #2d5b2850)}@keyframes sad{50%{transform:translateY(6px) rotate(4deg)}}.winner{box-shadow:inset 0 0 0 4px #ffe35c}.crumb{position:absolute;pointer-events:none;font-size:20px;animation:crumb .7s forwards}@keyframes crumb{to{transform:translate(var(--dx),-80px) rotate(80deg);opacity:0}}.confetti{position:absolute;z-index:7;top:-30px;left:var(--left);width:10px;height:17px;background:var(--color);animation:fall var(--duration) linear forwards;pointer-events:none}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(780deg);opacity:0}}.overlay{position:absolute;inset:0;z-index:10;display:flex;justify-content:center;align-items:center;padding:18px;background:#233e1bb8}.panel{width:100%;max-width:390px;text-align:center;background:linear-gradient(#fff9dc,#ffe3a6);border:5px solid #b67b36;border-radius:24px;padding:24px 18px;box-shadow:0 12px 40px #172c1966}.panel h2{font-size:29px;margin:6px 0;color:#653916}.panel p{font-size:15px;line-height:1.5}.mainbtn{border:3px solid #97531c;border-bottom:6px solid #a76019;border-radius:16px;background:linear-gradient(#ffe87c,#ffb930);color:#65370d;font-weight:1000;font-size:20px;padding:12px 25px;margin-top:10px}.countdown{font-size:70px;font-weight:1000;color:#b35c16;text-shadow:2px 3px white}.hidden{display:none!important}.record{font-size:13px;font-weight:800;margin-top:14px}@media(max-width:400px){.lanes{gap:5px;padding:4px 5px 12px}.lane{padding:3px 4px 8px}.pigbox{height:116px}.leafbox{height:115px}.tap{min-height:85px}.heading{margin-top:6px}.timer{margin:8px auto}}@media(min-width:700px){.scene{min-height:100dvh}.pigbox{height:230px}.leafbox{height:180px}}
</style></head><body><main id="game" class="scene"><div class="cloud"></div><div class="cloud right"></div><div class="fence"></div><div class="flowers"></div><header class="heading"><b>🌼 Reggie &amp; Ronnie 🌼</b><span>DANDELION DASH!</span></header><div class="timer" id="timer">0.00s</div><div class="lanes"><section class="lane" id="lane0"><div class="name"><strong>Reggie</strong><small>PLAYER 1</small></div><div class="pigbox" id="pig0"></div><div class="leafbox" id="leaf0"></div><div class="meter"><div class="fill" id="fill0"></div></div><div class="stats"><span>LEAF LEFT</span><span class="pct" id="pct0">100%</span></div><div class="bites" id="bites0">0 bites</div><button class="tap" id="tap0"><span class="hand">👆</span>TAP TO MUNCH!</button></section><section class="lane" id="lane1"><div class="name"><strong>Ronnie</strong><small>PLAYER 2</small></div><div class="pigbox" id="pig1"></div><div class="leafbox" id="leaf1"></div><div class="meter"><div class="fill" id="fill1"></div></div><div class="stats"><span>LEAF LEFT</span><span class="pct" id="pct1">100%</span></div><div class="bites" id="bites1">0 bites</div><button class="tap" id="tap1"><span class="hand">👆</span>TAP TO MUNCH!</button></section></div><div class="overlay" id="overlay"><div class="panel"><div style="font-size:45px" id="emoji">🐹🌿🐹</div><h2 id="heading">Ready to munch?</h2><p id="description">Two hungry guinea pigs, two enormous dandelion leaves! Player 1 taps for Reggie, Player 2 taps for Ronnie. First to 50 bites wins!</p><div class="countdown hidden" id="countdown">3</div><button class="mainbtn" id="start">START RACE! 🌿</button><div class="record" id="record"></div></div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),goal=50;let counts=[0,0],running=false,locked=true,startTime=0,raf=0,round=0;
function pig(i){const c=i?'#e68b35':'#292b31',d=i?'#c16a25':'#16191e';return `<svg class="pig" viewBox="0 0 220 165" aria-label="${i?'Ronnie ginger and white':'Reggie black and white'} guinea pig"><ellipse cx="110" cy="151" rx="95" ry="10" fill="#376f2944"/><ellipse cx="122" cy="100" rx="92" ry="55" fill="#fff7e9" stroke="#ad9c8d" stroke-width="2"/><path d="M44 65 Q80 34 126 51 Q153 83 130 139 L56 138 Q24 110 44 65Z" fill="${c}"/><path d="M142 52 Q191 48 207 96 Q202 140 158 146 Q181 102 142 52Z" fill="${c}"/><ellipse cx="83" cy="91" rx="71" ry="66" fill="#fff9f0" stroke="#b9a69a" stroke-width="2"/><path d="M15 83 Q17 27 78 25 Q109 42 102 91 Q78 112 43 119 Q14 104 15 83Z" fill="${d}"/><path d="M105 43 Q136 64 120 108 L99 119 Q89 85 105 43Z" fill="${c}"/><ellipse cx="38" cy="37" rx="22" ry="26" fill="${c}" stroke="#947a70" stroke-width="2" transform="rotate(-22 38 37)"/><ellipse cx="38" cy="37" rx="13" ry="17" fill="#dd9a9f" transform="rotate(-22 38 37)"/><ellipse cx="124" cy="46" rx="20" ry="24" fill="${c}" stroke="#947a70" stroke-width="2"/><ellipse cx="124" cy="46" rx="12" ry="15" fill="#dd9a9f"/><ellipse cx="51" cy="88" rx="12" ry="14" fill="#14151b"/><ellipse cx="48" cy="84" rx="4" ry="5" fill="white"/><ellipse cx="116" cy="91" rx="9" ry="11" fill="#14151b"/><circle cx="113" cy="87" r="3.5" fill="white"/><ellipse cx="83" cy="123" rx="13" ry="9" fill="#e99ca4"/><path d="M83 132 Q73 143 63 134 M83 132 Q93 143 103 134" fill="none" stroke="#9e7775" stroke-width="2.5" stroke-linecap="round"/><path d="M67 123 L31 118 M66 130 L28 135 M101 124 L140 118 M101 131 L140 136" stroke="#c5aea1" stroke-width="1.6"/><ellipse cx="53" cy="153" rx="24" ry="10" fill="#f0c5bd"/><ellipse cx="167" cy="153" rx="23" ry="10" fill="#f0c5bd"/></svg>`}
function leaf(i){return `<svg class="leaf" viewBox="0 0 180 160" aria-label="Dandelion leaf"><defs><clipPath id="clip${i}"><rect id="rect${i}" x="0" y="0" width="180" height="160"/></clipPath></defs><g clip-path="url(#clip${i})"><path d="M90 158 Q85 137 88 125 L53 143 L61 114 L24 128 L40 102 L8 91 L44 79 L23 55 L62 64 L56 30 L82 49 L92 5 L106 47 L137 18 L130 61 L166 48 L148 81 L176 95 L142 109 L159 139 L119 125 Q114 146 90 158Z" fill="#439b29" stroke="#287520" stroke-width="3" stroke-linejoin="round"/><path d="M90 158 L93 43 M91 106 L43 80 M91 123 L147 82 M92 77 L61 60 M93 91 L132 59" stroke="#a3d967" stroke-width="4" fill="none" stroke-linecap="round"/></g></svg>`}
for(let i=0;i<2;i++){$('pig'+i).innerHTML=pig(i);$('leaf'+i).innerHTML=leaf(i)}
function record(){try{return Number(localStorage.getItem('dandelion-dash-best'))||0}catch{return 0}}function save(t){try{localStorage.setItem('dandelion-dash-best',String(t))}catch{}}function showRecord(){let r=record();$('record').textContent=r?'🏅 Fastest race: '+r.toFixed(2)+'s':'🏅 No race record yet'}showRecord();function tick(){if(!running)return;$('timer').textContent=((performance.now()-startTime)/1000).toFixed(2)+'s';raf=requestAnimationFrame(tick)}function reset(){counts=[0,0];running=false;locked=true;cancelAnimationFrame(raf);$('timer').textContent='0.00s';for(let i=0;i<2;i++){$('bites'+i).textContent='0 bites';$('pct'+i).textContent='100%';$('fill'+i).style.width='100%';$('rect'+i).setAttribute('y',0);$('rect'+i).setAttribute('height',160);$('pig'+i).className='pigbox';$('lane'+i).classList.remove('winner');$('tap'+i).disabled=false}}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));async function begin(){let token=++round;reset();$('start').classList.add('hidden');$('countdown').classList.remove('hidden');for(let n=3;n>0;n--){$('countdown').textContent=n;await sleep(750);if(token!==round)return}$('countdown').textContent='GO!';await sleep(350);if(token!==round)return;$('overlay').classList.add('hidden');$('countdown').classList.add('hidden');locked=false;running=true;startTime=performance.now();tick()}
function confetti(){for(let j=0;j<55;j++){let el=document.createElement('div');el.className='confetti';el.style.setProperty('--left',Math.random()*100+'%');el.style.setProperty('--color',['#ffe24d','#ff8b3e','#7bd84a','#fff','#f79fc5'][j%5]);el.style.setProperty('--duration',(1.5+Math.random()*1.6)+'s');el.style.setProperty('--dx',(Math.random()*160-80)+'px');$('game').append(el);setTimeout(()=>el.remove(),3400)}}
function finish(i){locked=true;running=false;cancelAnimationFrame(raf);let t=(performance.now()-startTime)/1000,old=record(),best=!old||t<old;if(best)save(t);$('timer').textContent=t.toFixed(2)+'s';$('lane'+i).classList.add('winner');$('pig'+i).classList.add('happy');$('pig'+(1-i)).classList.add('sad');$('tap0').disabled=$('tap1').disabled=true;confetti();$('emoji').textContent='🏆🐹🌼';$('heading').textContent=(i?'RONNIE':'REGGIE')+' WINS!';$('description').textContent=(i?'Ronnie':'Reggie')+' finished the leaf in '+t.toFixed(2)+' seconds! '+(best?'A brand-new race record!':'What a speedy little pig!')+' Final bites: Reggie '+counts[0]+' · Ronnie '+counts[1]+'.';$('start').textContent='RACE AGAIN! ↻';showRecord();setTimeout(()=>{$('overlay').classList.remove('hidden');$('start').classList.remove('hidden')},1600)}
function munch(i){if(!running||locked)return;counts[i]++;let left=Math.max(0,1-counts[i]/goal);$('bites'+i).textContent=counts[i]+' bites';$('pct'+i).textContent=Math.ceil(left*100)+'%';$('fill'+i).style.width=left*100+'%';$('rect'+i).setAttribute('y',160*(1-left));$('rect'+i).setAttribute('height',160*left);let p=$('pig'+i);p.classList.remove('chew');void p.offsetWidth;p.classList.add('chew');if(counts[i]%4===0){let e=document.createElement('span');e.className='crumb';e.textContent='🌿';e.style.left=(30+Math.random()*35)+'%';e.style.top='50%';e.style.setProperty('--dx',(Math.random()*90-45)+'px');$('leaf'+i).append(e);setTimeout(()=>e.remove(),700)}if(counts[i]>=goal)finish(i)}
for(let i=0;i<2;i++)$('tap'+i).addEventListener('pointerdown',e=>{e.preventDefault();munch(i)});$('start').addEventListener('click',begin);
})();
</script></body></html>
