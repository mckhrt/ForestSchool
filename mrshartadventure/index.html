<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mrs Hart’s Forest School Adventure</title>
<style>
:root{--bg:#eef7e8;--fg:#2f4a2f;--muted:#6f8a6a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1a14;--fg:#d9efd2;--muted:#7f9a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a14;--fg:#d9efd2;--muted:#7f9a7a;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#wrap{width:min(100%,900px);padding:12px;box-sizing:border-box;text-align:center}
canvas{width:100%;height:auto;display:block;aspect-ratio:8/3;cursor:pointer;border-radius:14px}
h1{font-size:20px;margin:0 0 10px}
p{color:var(--muted);font-size:13px;margin:10px 0 0}
</style>
</head>
<body>
<div id="wrap">
  <h1>🌲 Mrs Hart’s Forest School Adventure 🌲</h1>
  <canvas id="c" width="800" height="300"></canvas>
  <p>Space / ↑ / tap to jump · ↓ to duck · hop over the chickens and critters!<br>Tailwind lifts and carries your jump; a headwind holds you back.</p>
</div>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=300,GY=250,PX=90,CYCLE=3600;
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const RAINBOW=['#ff3b3b','#ff9f1c','#ffe14d','#3ddc84','#3b9cff','#9b5cff'];
let best=0;
try{best=parseInt(localStorage.getItem('fs-best')||'0',10)||0}catch(e){}
const mod=(a,b)=>((a%b)+b)%b;
const lerp=(a,b,t)=>a+(b-a)*t;
const mix=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));
const rgb=c=>'rgb('+c.map(Math.round).join(',')+')';
const KF=[[0,[191,232,255],[244,251,232],0],[.42,[191,232,255],[244,251,232],0],[.52,[255,170,120],[255,226,184],.2],
[.62,[60,64,122],[122,111,160],.7],[.72,[16,22,58],[36,48,96],1],[.88,[16,22,58],[36,48,96],1],
[.95,[255,194,160],[255,236,207],.3],[1,[191,232,255],[244,251,232],0]];
function sky(t){
  for(let i=1;i<KF.length;i++){
    if(t<=KF[i][0]){const a=KF[i-1],b=KF[i],u=(t-a[0])/(b[0]-a[0]);
      return{top:mix(a[1],b[1],u),bot:mix(a[2],b[2],u),n:lerp(a[3],b[3],u)}}
  }
  return{top:KF[0][1],bot:KF[0][2],n:0};
}
const stars=Array.from({length:45},(_, i)=>({x:(i*173)%W,y:(i*61)%150+8,r:(i%3)*0.4+0.7}));
const flies=Array.from({length:14},(_, i)=>({x:(i*97)%W,y:150+(i*37)%90,p:i*1.7}));
let st;
const rain=Array.from({length:100},(_, i)=>({x:(i*83)%W,y:(i*47)%H,l:8+(i%4)*3}));
const snow=Array.from({length:80},(_, i)=>({x:(i*101)%W,y:(i*53)%H,r:1+(i%3)*0.7,p:i}));
const streaks=Array.from({length:18},(_, i)=>({x:(i*61)%W,y:30+(i*29)%210,l:30+(i%4)*14}));
const leaves=Array.from({length:12},(_, i)=>({x:(i*71)%W,y:40+(i*23)%190,p:i,c:i%2?'#7cc47a':'#e8a23a'}));
const WXT=['sun','rain','snow','wind','wind'];
function nextWx(prev){
  let t;do{t=WXT[Math.floor(Math.random()*WXT.length)]}while(t===prev);
  const left=600+Math.floor(Math.random()*500);
  return{type:t,left:left,dur:left,dir:Math.random()<0.5?-1:1,str:0.6+Math.random()*0.4};
}
function updateWeather(){
  let wx=st.wx;
  if(--wx.left<=0)wx=st.wx=nextWx(wx.type);
  const k=Math.max(0,Math.min(1,(wx.dur-wx.left)/60,wx.left/60));
  st.k=k;st.w=wx.type==='wind'?wx.dir*wx.str*k:0;
  for(const r of rain){r.y+=14+r.l*0.2;r.x-=3;if(r.y>H){r.y=-20;r.x=Math.random()*(W+60)}if(r.x<0)r.x+=W}
  for(const s of snow){s.y+=0.8+s.r*0.4;s.x=mod(s.x+Math.sin(st.f*0.03+s.p)*0.6-0.4,W);if(s.y>H){s.y=-5;s.x=Math.random()*W}}
  if(wx.type==='wind'){
    for(const s of streaks)s.x=mod(s.x+wx.dir*(10+s.l*0.15)*(0.5+k*0.5),W+80);
    for(const l of leaves){l.x=mod(l.x+st.w*9,W+40);l.y+=Math.sin(st.f*0.05+l.p)*0.8}
  }
}
function wxLabel(n){
  const wx=st.wx;
  if(wx.type==='sun')return n>0.5?'🌙 Clear skies':'☀️ Sunny';
  if(wx.type==='rain')return '🌧️ Rain';
  if(wx.type==='snow')return '❄️ Snow';
  return wx.dir>0?'💨 Tailwind →':'← Headwind 💨';
}
function drawFx(){
  const wx=st.wx,k=st.k;if(k<=0)return;
  if(wx.type==='rain'){ctx.strokeStyle='rgba(170,205,240,'+0.65*k+')';ctx.lineWidth=1.3;ctx.beginPath();for(const r of rain){ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-3,r.y+r.l)}ctx.stroke()}
  else if(wx.type==='snow'){ctx.fillStyle='rgba(255,255,255,'+0.9*k+')';for(const s of snow){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}}
  else if(wx.type==='wind'){
    const d=wx.dir;ctx.strokeStyle='rgba(255,255,255,'+0.7*k+')';ctx.lineWidth=2;ctx.lineCap='round';
    for(const s of streaks){const x=s.x-40;ctx.beginPath();ctx.moveTo(x,s.y);ctx.lineTo(x-d*s.l,s.y);ctx.stroke()}
    for(const l of leaves){ctx.save();ctx.translate(l.x-20,l.y);ctx.rotate(st.f*0.1*wx.dir+l.p);ctx.fillStyle=l.c;ctx.beginPath();ctx.ellipse(0,0,5,2.5,0,0,7);ctx.fill();ctx.restore()}
  }
}
function reset(keepBg){
  st={mode:'ready',y:GY-36,vy:0,onGround:true,duck:false,speed:6,score:0,
      obs:[],trail:[],spawn:60,t:0,f:0,groundX:0,far:0,mid:0,dx:0,w:0,k:0,wx:{type:'sun',left:420,dur:420,dir:1,str:0.8}};
}
reset();
function jump(){
  if(st.mode==='over'&&st.t<20)return;
  if(st.mode==='ready'||st.mode==='over'){reset();st.mode='run'}
  if(st.onGround){st.vy=-13.2-st.w*1.6;st.onGround=false}
}
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}
  if(e.code==='ArrowDown'){e.preventDefault();st.duck=true;if(!st.onGround)st.vy+=3}
});
addEventListener('keyup',e=>{if(e.code==='ArrowDown')st.duck=false});
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});

function spawnObs(){
  const r=Math.random(),y0=GY;
  if(st.score>250&&r<0.28){
    st.obs.push({k:'robin',x:W+20,w:34,h:20,y:GY-46});
  }else{
    const kinds=['chicken','hedgehog','bunny','chicks'];
    const k=kinds[Math.floor(Math.random()*kinds.length)];
    const o={k,x:W+20,ph:Math.random()*6};
    if(k==='chicken'){o.w=34;o.h=30}
    else if(k==='hedgehog'){o.w=32;o.h=20}
    else if(k==='bunny'){o.w=28;o.h=32}
    else{o.n=2+Math.floor(Math.random()*2);o.w=o.n*20;o.h=15}
    o.y=GY-o.h;st.obs.push(o);
  }
  const gap=(280+Math.random()*260)*(st.speed/6);
  st.spawn=gap/st.speed;
}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){
  st.t++;st.f++;updateWeather();
  const sp=st.mode==='run'?st.speed:(st.mode==='ready'?2:0);
  st.far+=sp*0.1;st.mid+=sp*0.3;
  if(st.mode!=='run')return;
  st.speed=Math.min(6+st.score/260,15);
  st.score+=st.speed*0.06;
  st.groundX=(st.groundX-st.speed)%40;
  st.vy+=0.7-st.w*0.07;st.y+=st.vy;
  if(st.y>=GY-36){st.y=GY-36;st.vy=0;st.onGround=true}
  if(st.onGround)st.dx=st.dx*0.88+st.w*0.5;else st.dx=Math.max(-40,Math.min(40,st.dx+st.w*0.55));
  const h=st.duck&&st.onGround?22:36;
  st.trail.push({x:PX+8+st.dx,y:(st.onGround?GY-h:st.y)+h*0.55});
  for(const p of st.trail)p.x-=st.speed;
  while(st.trail.length&&st.trail[0].x<-10)st.trail.shift();
  st.spawn--;if(st.spawn<=0)spawnObs();
  for(const o of st.obs)o.x-=st.speed+(o.k==='robin'?1.5:0);
  st.obs=st.obs.filter(o=>o.x>-80);
  const pb={x:PX+9+st.dx,y:(st.onGround?GY-h:st.y)+3,w:18,h:h-5};
  for(const o of st.obs){
    if(hit(pb,{x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-6})){
      st.mode='over';st.t=0;
      if(Math.floor(st.score)>best){best=Math.floor(st.score);try{localStorage.setItem('fs-best',String(best))}catch(e){}}
    }
  }
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()}
function trees(off,spacing,r,trunkW,trunkH,trunkC,leafC){
  const N=Math.ceil((W+240)/spacing),tot=N*spacing;
  for(let i=0;i<N;i++){
    const x=mod(i*spacing-off,tot)-120,v=(i*37)%5;
    ctx.fillStyle=trunkC;ctx.fillRect(x-trunkW/2,GY-trunkH,trunkW,trunkH);
    const cy=GY-trunkH-r*0.3+v*3;
    circ(x,cy,r+v*2,leafC);circ(x-r*0.7,cy+r*0.4,r*0.7,leafC);circ(x+r*0.7,cy+r*0.4,r*0.7,leafC);
  }
}
function drawBg(){
  const s=sky((st.f%CYCLE)/CYCLE),tod=(st.f%CYCLE)/CYCLE;
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,rgb(s.top));g.addColorStop(1,rgb(s.bot));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(s.n>0.05){ctx.fillStyle='rgba(255,255,255,'+s.n+')';for(const q of stars){ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}}
  // sun or moon
  const sun=tod<0.55,u=sun?tod/0.55:(tod-0.55)/0.45;
  const bx=lerp(60,W-60,u),by=200-Math.sin(u*Math.PI)*150;
  if(sun){const sk=st.wx.type==='sun'?st.k:0;circ(bx,by,34+sk*22,'rgba(255,230,120,'+(0.25+sk*0.15)+')');circ(bx,by,20+sk*3,'#ffd84a')}
  else{circ(bx,by,18,'#f4f1dc');circ(bx+7,by-4,15,rgb(s.top))}
  trees(st.far,120,34,6,70,'rgba(170,200,150,0.9)','rgba(205,236,196,0.95)');
  trees(st.mid,185,46,10,92,'#b9a688','rgba(170,222,160,1)');
  // ground
  ctx.fillStyle='#8fd18a';ctx.fillRect(0,GY,W,14);
  ctx.fillStyle='#d9c29a';ctx.fillRect(0,GY+14,W,H-GY-14);
  ctx.fillStyle='#6fb36b';ctx.fillRect(0,GY,W,2);
  ctx.fillStyle='#c4a97c';
  for(let x=st.groundX;x<W;x+=40)ctx.fillRect(x,GY+26,14,3);
  ctx.fillStyle='#5aa35a';
  for(let x=st.groundX+10;x<W;x+=40){ctx.fillRect(x,GY-4,2,5);ctx.fillRect(x+4,GY-6,2,7)}
  const wx=st.wx,wk=st.k;
  if(wx.type==='snow'){ctx.fillStyle='rgba(246,250,255,'+wk*0.9+')';ctx.fillRect(0,GY-1,W,15)}
  if(wx.type==='rain'){ctx.fillStyle='rgba(95,115,140,'+wk*0.3+')';ctx.fillRect(0,0,W,H)}
  else if(wx.type==='snow'){ctx.fillStyle='rgba(140,155,175,'+wk*0.18+')';ctx.fillRect(0,0,W,H)}
  else if(wx.type==='sun'&&s.n<0.5){ctx.fillStyle='rgba(255,236,150,'+wk*0.12*(1-s.n*2)+')';ctx.fillRect(0,0,W,H)}
  return s;
}
function drawTrail(){
  const bw=5,n=RAINBOW.length;
  ctx.lineCap='butt';ctx.lineJoin='round';ctx.lineWidth=bw+0.6;
  for(let i=0;i<n;i++){
    ctx.strokeStyle=RAINBOW[i];ctx.beginPath();
    const off=(i-(n-1)/2)*bw;
    st.trail.forEach((p,j)=>{j?ctx.lineTo(p.x,p.y+off):ctx.moveTo(p.x,p.y+off)});
    ctx.stroke();
  }
}
function drawPlayer(){
  const ducking=st.duck&&st.onGround;
  const y=st.onGround?GY-36:st.y;
  ctx.save();ctx.translate(st.dx,0);
  if(ducking){ctx.translate(0,GY);ctx.scale(1,0.62);ctx.translate(0,-GY)}
  const s=Math.floor(st.t/5)%2,run=st.onGround&&st.mode==='run';
  const bob=run?(s?1.5:-1.5):0;
  // ponytail, blown by the wind
  ctx.strokeStyle='#f3cf62';ctx.lineWidth=4.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(PX+13,y+5);ctx.quadraticCurveTo(PX+4+st.w*4,y+2+bob,PX+4+st.w*9,y+13+bob);ctx.stroke();
  // backpack
  ctx.fillStyle='#e76f51';rr(PX+6,y+16,8,12,3);ctx.fill();
  // legs and boots
  const a=run?(s?0:6):0,b=run?(s?6:0):0;
  ctx.fillStyle='#3d5a3a';ctx.fillRect(PX+13+a,y+27,4,7);ctx.fillRect(PX+21-b,y+27,4,7);
  ctx.fillStyle='#6b4a2f';ctx.fillRect(PX+13+a,y+33,6,3);ctx.fillRect(PX+21-b,y+33,6,3);
  // slim waterproof jacket, arm and whistle
  ctx.fillStyle='#2a9d8f';rr(PX+12,y+14,15,15,5);ctx.fill();
  ctx.strokeStyle='#23857a';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(PX+19,y+17);ctx.lineTo(PX+19+(run?(s?6:-6):3),y+25);ctx.stroke();
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(PX+17,y+14);ctx.lineTo(PX+20,y+21);ctx.lineTo(PX+23,y+14);ctx.stroke();
  circ(PX+20,y+22,1.8,'#ffd23f');
  // head with blonde hair
  circ(PX+18,y+8,8.5,'#f3cf62');
  circ(PX+21,y+9.5,6.3,'#f6cfad');
  ell(PX+20,y+3.5,8,3.5,'#f3cf62');
  circ(PX+24,y+9.5,1.3,'#2b2b3a');
  ctx.strokeStyle='#c0605a';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(PX+24,y+11.5,2.8,0.3,Math.PI-0.5);ctx.stroke();
  ctx.restore();
}
function drawObs(o){
  const b=Math.abs(Math.sin(st.t*0.15+(o.ph||0)))*2.5;
  ctx.save();
  if(o.k==='robin'){
    const flap=Math.floor(st.t/7)%2;ctx.translate(o.x+o.w,o.y);ctx.scale(-1,1);
    ell(14,12,13,7,'#8a6a4a');circ(24,9,6,'#8a6a4a');circ(22,14,6,'#ff7a4a');
    ctx.fillStyle='#ffb02e';ctx.beginPath();ctx.moveTo(29,8);ctx.lineTo(35,10);ctx.lineTo(29,12);ctx.fill();
    circ(25,8,1.3,'#222');
    ctx.fillStyle='#6f5238';ctx.beginPath();ctx.moveTo(10,10);ctx.lineTo(16,flap?-6:22);ctx.lineTo(21,10);ctx.fill();
  }else if(o.k==='chicken'){
    ctx.translate(o.x+o.w,o.y-b*0.0);ctx.scale(-1,1);
    ctx.strokeStyle='#ff9f1c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,26);ctx.lineTo(14,30);ctx.moveTo(21,26);ctx.lineTo(21,30);ctx.stroke();
    ctx.translate(0,-b*0.4);
    ctx.fillStyle='#fff3dd';ctx.beginPath();ctx.moveTo(6,12);ctx.lineTo(-2,6);ctx.lineTo(4,20);ctx.fill();
    ell(17,19,13,9,'#fffaf0');ell(15,20,6,4,'#f0e2c4');
    circ(28,9,6,'#fffaf0');circ(25,3,2.6,'#e63946');circ(29,2.5,2.6,'#e63946');
    ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(33,8);ctx.lineTo(39,10);ctx.lineTo(33,12);ctx.fill();
    circ(31,13,2,'#e63946');circ(30,8,1.3,'#222');
  }else if(o.k==='hedgehog'){
    ctx.translate(o.x+o.w,o.y);ctx.scale(-1,1);
    ctx.fillStyle='#6b4f38';
    for(let i=0;i<9;i++){ctx.beginPath();ctx.moveTo(3+i*3.2,10);ctx.lineTo(5+i*3.2,-1+(i%2)*2);ctx.lineTo(8+i*3.2,10);ctx.fill()}
    ell(16,13,14,8,'#8b6b4e');ell(28,15,6,4.5,'#e8c9a0');circ(33,15,1.7,'#222');circ(28,12.5,1.2,'#222');
    ctx.fillStyle='#5a4230';ctx.fillRect(10,19,4,2);ctx.fillRect(22,19,4,2);
  }else if(o.k==='bunny'){
    ctx.translate(o.x+o.w,o.y);ctx.scale(-1,1);ctx.translate(0,-b);
    ell(12,24,11,8,'#f3ece4');circ(3,25,3.5,'#fff');circ(21,17,6.5,'#f3ece4');
    ell(18,7,2.6,7,'#f3ece4');ell(24,7,2.6,7,'#f3ece4');ell(18,7,1.2,5,'#f4a6b8');ell(24,7,1.2,5,'#f4a6b8');
    circ(23,16,1.3,'#222');circ(27,19,1.4,'#f4a6b8');
  }else if(o.k==='chicks'){
    ctx.translate(o.x+o.w,o.y);ctx.scale(-1,1);
    for(let i=0;i<o.n;i++){
      const bb=Math.abs(Math.sin(st.t*0.2+i*1.5))*3;
      ctx.translate(0,-bb);
      circ(8+i*20,9,6.5,'#ffe066');circ(14+i*20,5,4.2,'#ffe066');
      ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(17.5+i*20,5);ctx.lineTo(21+i*20,6);ctx.lineTo(17.5+i*20,7);ctx.fill();
      circ(15+i*20,4,1,'#222');
      ctx.translate(0,bb);
    }
  }
  ctx.restore();
}
function pill(x,y,w,h){ctx.fillStyle='rgba(255,255,255,0.72)';rr(x,y,w,h,10);ctx.fill()}
function draw(){
  ctx.clearRect(0,0,W,H);
  const s=drawBg();
  drawTrail();st.obs.forEach(drawObs);drawPlayer();drawFx();
  if(s.n>0){ctx.fillStyle='rgba(12,18,50,'+(s.n*0.36)+')';ctx.fillRect(0,0,W,H)}
  if(s.n>0.3){
    for(const f of flies){
      const a=s.n*(0.5+0.5*Math.sin(st.f*0.05+f.p));
      const fx=mod(f.x-st.mid*0.5+Math.sin(st.f*0.02+f.p)*12,W),fy=f.y+Math.cos(st.f*0.03+f.p)*10;
      circ(fx,fy,6,'rgba(255,240,120,'+a*0.25+')');circ(fx,fy,2,'rgba(255,250,170,'+a+')');
    }
  }
  // HUD
  pill(W-200,10,190,50);pill(10,10,100,30);pill(10,46,170,28);
  ctx.textAlign='right';ctx.fillStyle='#2f4a2f';
  ctx.font='bold 13px Georgia,serif';ctx.fillText('SCORE',W-120,30);
  ctx.font='bold 26px Georgia,serif';ctx.fillText(String(Math.floor(st.score)).padStart(5,'0'),W-20,34);
  ctx.font='12px Georgia,serif';ctx.fillStyle='#6f8a6a';ctx.fillText('Best '+String(best).padStart(5,'0'),W-20,53);
  ctx.textAlign='left';ctx.fillStyle='#2f4a2f';ctx.font='bold 15px Georgia,serif';
  ctx.fillText((s.n>0.5?'🌙':'☀️')+' Day '+(Math.floor(st.f/CYCLE)+1),20,31);ctx.font='14px Georgia,serif';ctx.fillText(wxLabel(s.n),20,65);
  ctx.textAlign='center';
  if(st.mode==='ready'){
    pill(W/2-250,70,500,86);
    ctx.fillStyle='#2f4a2f';ctx.font='bold 26px Georgia,serif';ctx.fillText('Mrs Hart’s Forest School Adventure',W/2,106);
    ctx.font='16px Georgia,serif';ctx.fillText('Press Space or tap to start',W/2,136);
  }else if(st.mode==='over'){
    pill(W/2-170,70,340,90);
    ctx.fillStyle='#2f4a2f';ctx.font='bold 26px Georgia,serif';ctx.fillText('Oh no, a critter got you!',W/2,106);
    ctx.font='16px Georgia,serif';ctx.fillText('Press Space or tap to try again',W/2,138);
  }
}
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(now-last,100);last=now;
  while(acc>=1000/60){update();acc-=1000/60}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
